      responses:
        '200':
          description: Demandes d'adhésion réseau reçues
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        relationship_uid:
                          type: string
                          format: uuid
                        status:
                          type: string
                          enum: [PENDING, ACTIVE, REJECTED, ENDED]
                        initiated_by:
                          type: string
                          nullable: true
                        rejected_reason:
                          type: string
                          nullable: true
                        starts_at:
                          type: string
                          nullable: true
                        ends_at:
                          type: string
                          nullable: true
                        metadata:
                          type: object
                        provider:
                          type: object
                          properties:
                            organization_uid:
                              type: string
                              format: uuid
                            name:
                              type: string
                              nullable: true
                            type:
                              type: string
                              nullable: true
                            country_code:
                              type: string
                              nullable: true
                  meta:
                    type: object
                    properties:
                      insurer_uid:
                        type: string
                      insurer_organization_uid:
                        type: string
                        format: uuid
                      relationship_count:
                        type: integer
              example:
                data:
                  - relationship_uid: 98000000-0000-4000-8000-000000000021
                    status: PENDING
                    initiated_by: provider
                    rejected_reason: null
                    starts_at: null
                    ends_at: null
                    metadata:
                      requested_network_tier: standard
                      service_families: [OUTPATIENT, PHARMACY]
                      message: Demande d'adhésion au réseau soins ambulatoires.
                    provider:
                      organization_uid: 3d2e1a00-0000-4000-8000-000000000077
                      name: Pharmacie du Plateau
                      type: pharmacy
                      country_code: CI
                meta:
                  insurer_uid: 5d000000-0000-4000-8000-000000000010
                  insurer_organization_uid: 5d000000-0000-4000-8000-000000000010
                  relationship_count: 1
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
        '403':
          description: Scope `insurer.providers.view` manquant
