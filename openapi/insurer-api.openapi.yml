              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total_subscriptions:
                        type: integer
                      active_subscriptions:
                        type: integer
                      total_policyholders:
                        type: integer
                      total_premiums:
                        type: number
