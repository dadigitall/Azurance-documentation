              to_status:
                type: string
              reason:
                type: string
                nullable: true
              changed_by:
                type: string
                nullable: true
              changed_at:
                type: string
                format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateSubscriptionRequest:
      type: object
      required: [policyholder_uuid, subscription_number, plan_code, effective_date, expiry_date]
      properties:
        policyholder_uuid:
          type: string
          format: uuid
        subscription_number:
          type: string
          maxLength: 60
          description: Doit être unique pour ce tenant.
        plan_code:
          type: string
          maxLength: 50
        plan_name:
          type: string
          maxLength: 150
        status:
          type: string
          enum: [PENDING, ACTIVE, SUSPENDED, EXPIRED, CANCELLED]
