        channels_enabled:
          type: array
          items:
            type: string
            enum: [EMAIL, SMS, WHATSAPP, PUSH, IN_APP]
        is_enabled:
          type: boolean
    Webhook:
      type: object
      description: '`secret` n''est jamais renvoyé par l''API, y compris juste après création — le conserver côté intégrateur dès la création.'
      properties:
        uuid:
          type: string
          format: uuid
        tenant_id:
          type: string
        name:
          type: string
        target_url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        metadata:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateWebhookRequest:
      type: object
      required: [name, target_url, secret, event_types]
      properties:
        name:
          type: string
          maxLength: 160
        target_url:
          type: string
          format: uri
          maxLength: 1000
          description: >-
            HTTPS obligatoire, port 443 uniquement par défaut, pas d'identifiants dans
            l'URL, pas d'hôte `localhost`/`.local`/IP privée ou réservée (protection SSRF).
        secret:
          type: string
          minLength: 16
          maxLength: 160
          description: Utilisé pour signer les payloads livrés (HMAC) ; voir `postman/ERP-SECURITY-HARDENING.md` côté repo de code pour le détail de la vérification de signature.
        event_types:
          type: array
          minItems: 1
          items:
            type: string
            maxLength: 120
          description: Pas de catalogue fermé côté validation — n'importe quelle chaîne est acceptée ; utiliser les noms d'événements documentés dans le guide webhooks.
        is_active:
          type: boolean
          default: true
        metadata:
          type: object
    UpdateWebhookRequest:
      type: object
      description: Tous les champs sont optionnels (mise à jour partielle).
      properties:
        name:
          type: string
          maxLength: 160
        target_url:
          type: string
          format: uri
          maxLength: 1000
          description: Mêmes contraintes que sur la création (HTTPS, hôte public, port autorisé).
        secret:
          type: string
          minLength: 16
          maxLength: 160
          description: Remplace le secret existant si fourni ; omettre pour le conserver.
        event_types:
          type: array
          minItems: 1
          items:
            type: string
            maxLength: 120
        is_active:
          type: boolean
        metadata:
          type: object
          nullable: true
    TriggerFraudAssessmentRequest:
      type: object
      required: [trigger, idempotency_key]
      properties:
        trigger:
          type: string
          enum: [CLAIM_SUBMITTED, CLAIM_UPDATED, VALIDATION_REQUESTED, MANUAL_REVIEW]
          description: Événement à l'origine du déclenchement de l'évaluation.
        priority:
          type: string
          enum: [NORMAL, HIGH, URGENT]
          default: NORMAL
        idempotency_key:
          type: string
          maxLength: 160
          description: >-
            Si une évaluation existe déjà pour ce claim avec la même `idempotency_key`, elle
            est renvoyée telle quelle (même `assessment_uuid`) sans relancer d'évaluation.
    FraudFeedbackRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED, INFO_NEEDED]
          description: Décision humaine sur le résultat de l'évaluation fraude.
        reason_codes:
          type: array
          items:
            type: string
          description: Codes libres justifiant la décision (pas de liste fermée côté API).
        reviewer_role:
          type: string
          maxLength: 120
          description: Rôle libre de la personne ayant statué (ex. `claims_manager`).
    FraudAssessment:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        tenant_id:
          type: string
        claim_uuid:
          type: string
          format: uuid
        provider_uuid:
          type: string
          format: uuid
          nullable: true
          description: Renseigné une fois le contexte du claim résolu (peut être `null` tant que `status` est `QUEUED`).
        status:
          type: string
          enum: [QUEUED, RUNNING, PARTIAL, COMPLETED, FAILED, SUPERSEDED]
          description: >-
            `SUPERSEDED` : évaluation remplacée par une plus récente sur le même claim
            (jamais renvoyée par `.../fraud-assessment` qui ne renvoie que la dernière active).
        risk_score:
          type: integer
          nullable: true
          description: Score de 0 à 100, `null` tant que l'évaluation n'est pas terminée.
        risk_level:
          type: string
          nullable: true
          enum: [LOW, MEDIUM, HIGH, CRITICAL, null]
        recommended_action:
          type: string
          nullable: true
          enum: [CONTINUE, REVIEW_IF_ALREADY_IN_VALIDATION, PRIORITIZE_HUMAN_REVIEW, SENIOR_REVIEW_REQUIRED, null]
        trigger:
          type: string
        priority:
          type: string
        request_id:
          type: string
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        flags:
          type: array
          description: Vide tant que l'évaluation n'a pas produit de signal (statut `QUEUED`/`RUNNING`).
          items:
            type: object
            properties:
              code:
                type: string
              category:
                type: string
              severity:
                type: string
                enum: [LOW, MEDIUM, HIGH, CRITICAL]
              confidence:
                type: number
                description: Entre 0 et 1.
              explanation:
                type: string
              evidence:
                type: object
                nullable: true
              source:
                type: string
                description: Règle ou moteur à l'origine du signal (ex. `RepeatedClaimRule`).
              source_version:
                type: string
                nullable: true
        ai_runs:
          type: array
          description: Historique des passages du moteur d'analyse IA sur cette évaluation, s'il y en a eu.
          items:
            type: object
            properties:
              agent_code:
                type: string
              provider:
                type: string
              model:
                type: string
              prompt_version:
                type: string
              output_schema_version:
                type: string
              tokens:
                type: integer
                nullable: true
              estimated_cost:
                type: number
                nullable: true
              status:
                type: string
