openapi: 3.0.3
info:
  title: AZURANCE ERP Insurer API
  version: 0.3.0
  description: >
    API externe sandbox pour ERP compagnies d'assurance. Le tenant assurance est toujours dérivé de
    X-Api-Key; aucun tenant_id, tenant_uid, insurer_uid ou insurer_uuid fourni par le client n'est accepté.
  license:
    name: Proprietary
servers:
  - url: https://insurer-api-sandbox.elenami.com
    description: Sandbox publique
  - url: http://localhost:3102
    description: Développement local
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
  parameters:
    RequestId:
      in: header
      name: X-Request-Id
      required: false
      schema:
        type: string
    Page:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
    PerPage:
      in: query
      name: per_page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    ClaimId:
      in: path
      name: claimId
      required: true
      description: >-
        UUID du claim (champ `uuid` de la ressource Claim ; ce n'est pas l'`id` numérique interne).
      schema:
        type: string
        format: uuid
      example: 7c3f9e10-2b4a-4f61-9d3e-1a2b3c4d5e6f
    AssessmentUuid:
      in: path
      name: uuid
      required: true
      description: UUID de l'évaluation de fraude (`assessment_uuid` renvoyé à la création).
      schema:
        type: string
        format: uuid
    Cursor:
      in: query
      name: cursor
      required: false
      description: >-
        Pour la page suivante, repasser la valeur de `meta.next_cursor` de la réponse
        précédente. Omis ou absent : démarre depuis le début.
      schema:
        type: integer
        minimum: 0
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
    AuthError:
      type: object
      description: >-
        Format d'erreur renvoyé par l'API (authentification/scopes), distinct du format
        `Error` renvoyé par les services en aval.
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string
    ClaimStatus:
      type: string
      description: >-
        Statut du claim. `SUBMITTED` est l'état initial à la création et n'est pas atteignable
        via `PUT/PATCH .../status`, qui ne permet que les transitions vers les 4 autres statuts.
      enum: [SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, PAID]
    ClaimItem:
      type: object
      properties:
        id:
          type: integer
        description:
          type: string
        quantity:
          type: number
        unit_price:
          type: number
        amount:
          type: number
        prescription_uid:
          type: string
          nullable: true
        prescription_line_uid:
          type: string
          nullable: true
        prescribed_medication_code:
          type: string
          nullable: true
        medication_code:
          type: string
          nullable: true
        prescribed_quantity:
          type: number
          nullable: true
        dispensed_quantity:
          type: number
          nullable: true
        substitution_reason:
          type: string
          nullable: true
        batch_number:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
    ClaimDocument:
      type: object
      properties:
        id:
          type: integer
        document_type:
          type: string
          enum: [INVOICE, PRESCRIPTION, MEDICAL_REPORT, LAB_RESULT, OTHER]
        media_uid:
          type: string
          nullable: true
          description: Référence du média ; utiliser cet identifiant pour récupérer le fichier, jamais exposé en URL directe ici.
        original_name:
          type: string
          nullable: true
        file_name:
          type: string
          nullable: true
        file_size:
          type: integer
          nullable: true
          description: Taille en octets.
        mime_type:
          type: string
          nullable: true
        sha256_hash:
          type: string
          nullable: true
        media_status:
          type: string
          nullable: true
          description: Statut du scan antivirus (ex. `CLEAN`, `PENDING`, `INFECTED`).
        metadata:
          type: object
          nullable: true
        uploaded_at:
          type: string
          format: date-time
          nullable: true
    Claim:
      type: object
      properties:
        id:
          type: integer
          description: Identifiant numérique interne — ne pas utiliser dans les URLs, préférer `uuid`.
        uuid:
          type: string
          format: uuid
        claim_number:
          type: string
          description: Numéro fonctionnel lisible du claim, distinct de `uuid`.
        tenant_id:
          type: string
          description: Tenant assureur, dérivé de la clé API (jamais fourni par le client).
        subscription_id:
          type: string
          nullable: true
        policyholder_id:
          type: string
          nullable: true
        provider_uuid:
          type: string
          format: uuid
        provider_reference:
          type: string
          nullable: true
          description: Référence libre fournie par le prestataire à la soumission.
        service_execution_uid:
          type: string
          nullable: true
        prior_authorization_uid:
          type: string
          nullable: true
          description: Renseigné si le claim découle d'une préautorisation approuvée.
        covered_person_type:
          type: string
          nullable: true
          description: '`POLICYHOLDER` ou `BENEFICIARY` selon qui a reçu le soin.'
        covered_person_uid:
          type: string
          nullable: true
        provider_name:
          type: string
          nullable: true
        coverage_type_code:
          type: string
          nullable: true
        fraud_assessment_uuid:
          type: string
          nullable: true
          description: >-
            Renseigné une fois qu'une évaluation fraude a été déclenchée
            (voir `POST /api/v1/claims/{claimId}/fraud-assessment`).
        fraud_risk_level:
          type: string
          nullable: true
        fraud_flag_summary:
          type: object
          nullable: true
        fraud_assessed_at:
          type: string
          format: date-time
          nullable: true
        required_documents:
          type: array
          nullable: true
          items:
            type: string
        missing_documents:
          type: array
          nullable: true
          items:
            type: string
        status:
          $ref: '#/components/schemas/ClaimStatus'
        amount_claimed:
          type: number
        amount_approved:
          type: number
          nullable: true
        amount_paid:
          type: number
          nullable: true
        currency:
          type: string
          example: XOF
        service_date:
          type: string
          format: date
        submitted_at:
          type: string
          format: date-time
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        paid_at:
          type: string
          format: date-time
          nullable: true
        rejection_reason:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        reviewed_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        documents_count:
          type: integer
          nullable: true
        documents:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ClaimDocument'
        items:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ClaimItem'
        latest_history:
          type: object
          nullable: true
          description: Dernière entrée de l'historique de statut ; `null` si le claim n'a jamais changé de statut.
          properties:
            id:
              type: integer
            claim_id:
              type: integer
            from_status:
              type: string
              nullable: true
            to_status:
              type: string
            changed_by:
              type: string
              nullable: true
            reason:
              type: string
              nullable: true
            created_at:
              type: string
              format: date-time
    UpdateClaimStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: >-
            Nouveau statut. Insensible à la casse, mais seules ces 4 valeurs sont
            aussi acceptées par le service claims en aval : `INFO_NEEDED` est rejeté par
            l'API (absent du validateur) et `PENDING` est accepté par l'API mais
            rejeté en 422 par le service claims. N'utiliser que les
            4 valeurs listées ci-dessous.
          enum: [UNDER_REVIEW, APPROVED, REJECTED, PAID]
        reason:
          type: string
          maxLength: 500
          description: Motif de la décision, en particulier pour un rejet.
        rejection_reason:
          type: string
          maxLength: 500
          description: >-
            Alias historique de `reason`. Si `reason` est aussi fourni, `reason` est prioritaire.
        reviewer_notes:
          type: string
          maxLength: 500
          description: >-
            Second alias de `reason`, utilisé seulement si ni `reason` ni `rejection_reason`
            ne sont fournis.
        reviewed_by:
          type: string
          maxLength: 100
          description: Identifiant libre de la personne ou du système ayant pris la décision.
    ValidationError:
      type: object
      description: Format standard d'erreur de validation Laravel (FormRequest).
      required: [message]
      properties:
        message:
          type: string
        errors:
          type: object
          description: Une entrée par champ en erreur, chacune listant un ou plusieurs messages.
          additionalProperties:
            type: array
            items:
              type: string
    ServiceUnavailableError:
      type: object
      properties:
        message:
          type: string
        service:
          type: string
          description: Service en amont injoignable.
    EligibilityCheckRequest:
      type: object
      required: [identifier, coverage_code]
      description: >-
        `provider_id` ou `provider_uuid` est obligatoire (l'un des deux, pas nécessairement
        les deux). `tenant_id`, `tenant_uid`, `insurer_uid` et `insurer_uuid` ne doivent
        jamais être fournis : l'API les rejette en 400 avant tout traitement
        (le tenant est toujours dérivé de `X-Api-Key`).
      properties:
        identifier:
          type: string
          maxLength: 50
          description: Identifiant de la personne assurée (numéro de police ou identifiant équivalent).
        coverage_code:
          type: string
          maxLength: 20
          description: Code de la couverture à vérifier, tel que renvoyé par `GET /api/v1/coverage-types`.
        amount:
          type: number
          minimum: 0
          description: >-
            Montant du soin à évaluer. S'il est fourni, la réponse inclut en plus un calcul
            de remboursement (`reimbursement`) et une vérification de plafond
            (`coverage.limit_usage`) ; s'il est omis, seule l'éligibilité de base est vérifiée.
        provider_id:
          type: integer
          minimum: 1
          description: Identifiant numérique interne du prestataire. Requis si `provider_uuid` est absent.
        provider_uuid:
          type: string
          maxLength: 100
          description: UUID du prestataire. Requis si `provider_id` est absent.
        beneficiary_id:
          type: string
          maxLength: 50
          description: >-
            À renseigner si le soin concerne un bénéficiaire de la souscription plutôt que
            le souscripteur (`identifier`) lui-même.
        service_date:
          type: string
          format: date
          description: Date du soin. Par défaut la date du jour si omis.
        purpose:
          type: string
          enum: [PRECHECK, CLAIM_SUBMISSION]
          default: PRECHECK
          description: >-
            `PRECHECK` (par défaut) : résultat mis en cache 5 minutes côté eligibility-service,
            pour une simulation avant soumission. `CLAIM_SUBMISSION` : vérification liée à
            une soumission réelle de claim, jamais mise en cache.
    EligibilityBatchCheckRequest:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          minItems: 1
          maxItems: 20
          description: >-
            Jusqu'à 20 vérifications en une requête. Chaque élément suit les mêmes règles
            que le corps de `POST /api/v1/eligibility/check`.
          items:
            $ref: '#/components/schemas/EligibilityCheckRequest'
    EligibilityCheckResult:
      type: object
      properties:
        eligibility_check_uuid:
          type: string
          format: uuid
        eligible:
          type: boolean
        status:
          type: string
          enum: [ELIGIBLE, INELIGIBLE]
        error_code:
          type: string
          nullable: true
          description: >-
            `null` si `eligible: true`. Sinon un code parmi (liste non exhaustive) :
            `MEMBER_NOT_FOUND`, `MEMBER_SUSPENDED`, `MEMBER_NOT_ACTIVE`, `KYC_NOT_VERIFIED`,
            `NO_ACTIVE_SUBSCRIPTION`, `PLAN_NOT_ACTIVE`, `COVERAGE_NOT_INCLUDED`,
            `BENEFICIARY_NOT_FOUND`, `BENEFICIARY_NOT_ELIGIBLE`, `PROVIDER_NOT_FOUND`,
            `PROVIDER_NOT_IN_NETWORK`, `LIMIT_EXCEEDED`, ou un code de décision dynamique du
            moteur de remboursement quand `amount` est fourni (ex. `REIMBURSEMENT_REJECTED`).
        reason:
          type: string
          nullable: true
          description: Message humainement lisible expliquant `error_code`.
        purpose:
          type: string
          enum: [PRECHECK, CLAIM_SUBMISSION]
        read_only:
          type: boolean
          description: Toujours `true` pour cet endpoint — une vérification n'engage ni ne réserve rien.
        valid_until:
          type: string
          format: date-time
          nullable: true
          description: Horodatage informatif jusqu'auquel considérer ce résultat comme frais (généralement +5 minutes).
        provider_network:
          type: object
          nullable: true
          description: >-
            Renseigné uniquement si `provider_uuid`/`provider_id` a pu être résolu. Contient
            au moins `in_network` (boolean).
        member:
          type: object
          nullable: true
          properties:
            uuid:
              type: string
              format: uuid
            policy_number:
              type: string
            identity_uid:
              type: string
              nullable: true
            full_name:
              type: string
            age:
              type: integer
              nullable: true
            status:
              type: string
            kyc_status:
              type: string
              nullable: true
        subscription:
          type: object
          nullable: true
          properties:
            uuid:
              type: string
              format: uuid
            subscription_number:
              type: string
            plan_code:
              type: string
            plan_name:
              type: string
            status:
              type: string
            effective_date:
              type: string
              format: date
              nullable: true
            expiry_date:
              type: string
              format: date
              nullable: true
            annual_coverage_limit:
              type: number
              nullable: true
            annual_used_amount:
              type: number
            remaining_coverage:
              type: number
              nullable: true
        coverage:
          type: object
          nullable: true
          properties:
            uuid:
              type: string
              format: uuid
            code:
              type: string
            name:
              type: string
            base_rate:
              type: number
              description: Taux de remboursement de base, entre 0 et 1.
            annual_limit:
              type: number
              nullable: true
            remaining_limit:
              type: number
              nullable: true
            requires_authorization:
              type: boolean
            network_restriction:
              type: string
              nullable: true
            limit_usage:
              type: object
              nullable: true
              description: Renseigné uniquement si `amount` était fourni dans la requête.
        reimbursement:
          type: object
          nullable: true
          description: >-
            Renseigné uniquement si `amount` était fourni dans la requête. Contient au moins
            `eligible`, `reimbursement_amount`, `decision` et `decision_reason`.
        contract_context:
          type: object
          nullable: true
          description: >-
            Contexte de trace, à titre de debug. Ne pas parser en production.
            Structure non garantie entre versions.
    CreatePaymentRequest:
      type: object
      required: [idempotency_key, payment_method, beneficiary_type, beneficiary_uuid, amount, allocations]
      properties:
        idempotency_key:
          type: string
          maxLength: 120
        payment_method:
          type: string
          enum: [MANUAL, MOBILE_MONEY, BANK_TRANSFER, CHECK]
        payment_provider:
          type: string
          enum: [MANUAL, ORANGE_MONEY, MTN_MOMO, WAVE, FAKE]
          description: >-
            Pertinent surtout pour `payment_method: MOBILE_MONEY` (`ORANGE_MONEY`,
            `MTN_MOMO`, `WAVE`). `FAKE` est réservé aux paiements simulés en sandbox.
        beneficiary_type:
          type: string
          enum: [PROVIDER, INSURED]
        beneficiary_uuid:
          type: string
          maxLength: 100
        beneficiary_name:
          type: string
          maxLength: 200
        amount:
          type: number
          minimum: 0.01
          description: Doit être égal à la somme des `amount` de `allocations` (tolérance de 0.005).
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: XOF
        requested_by:
          type: string
          maxLength: 160
        allocations:
          type: array
          minItems: 1
          description: Répartition du paiement sur une ou plusieurs factures/lignes payables.
          items:
            type: object
            required: [payable_invoice_uuid, amount]
            properties:
              payable_invoice_uuid:
                type: string
              payable_invoice_item_uuid:
                type: string
                nullable: true
                description: >-
                  Si omis, l'allocation cible la facture entière plutôt qu'une ligne précise.
              amount:
                type: number
                minimum: 0.01
                description: Ne peut pas dépasser le reste dû de la ligne (ou de la facture).
              metadata:
                type: object
        metadata:
          type: object
    ConfirmPaymentRequest:
      type: object
      required: [external_reference]
      description: >-
        S'applique à tout paiement `MANUAL`, `BANK_TRANSFER` ou `CHECK` en attente
        (`status: CREATED`) : le fait passer à `SUCCEEDED`. Un paiement déjà `FAILED` ou
        `CANCELLED` ne peut plus être confirmé (422).
      properties:
        external_reference:
          type: string
          maxLength: 160
          description: Référence de la preuve de paiement externe (numéro de virement, de chèque...).
        paid_at:
          type: string
          format: date-time
          nullable: true
          description: Date effective du paiement. Par défaut la date/heure de traitement si omis.
        proof_document_uid:
          type: string
          maxLength: 100
          nullable: true
          description: Référence d'un justificatif scanné, le cas échéant.
        metadata:
          type: object
          nullable: true
    PayableInvoiceItem:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        payable_invoice_uuid:
          type: string
          format: uuid
        claim_uuid:
          type: string
          format: uuid
          nullable: true
        claim_number:
          type: string
          nullable: true
        provider_invoice_ref:
          type: string
          nullable: true
        provider_invoice_line_ref:
          type: string
          nullable: true
        provider_patient_ref:
          type: string
          nullable: true
        service_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [UNPAID, PARTIALLY_PAID, PAID, CANCELLED]
        approved_amount:
          type: number
        paid_amount:
          type: number
        remaining_amount:
          type: number
        currency:
          type: string
        metadata:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PayableInvoice:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        invoice_number:
          type: string
        tenant_id:
          type: string
        beneficiary_type:
          type: string
          enum: [PROVIDER, INSURED]
        beneficiary_uuid:
          type: string
        beneficiary_name:
          type: string
          nullable: true
        provider_uuid:
          type: string
          format: uuid
          nullable: true
        provider_name:
          type: string
          nullable: true
        status:
          type: string
          enum: [DRAFT, ISSUED, PARTIALLY_PAID, PAID, CANCELLED]
        total_amount:
          type: number
        paid_amount:
          type: number
        remaining_amount:
          type: number
        currency:
          type: string
        period_start:
          type: string
          format: date
          nullable: true
        period_end:
          type: string
          format: date
          nullable: true
        issued_at:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        items:
          type: array
          nullable: true
          description: Présent uniquement sur `GET .../payable-invoices/{uuid}`, absent en liste.
          items:
            $ref: '#/components/schemas/PayableInvoiceItem'
    PaymentAllocation:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        tenant_id:
          type: string
        payment_uuid:
          type: string
          format: uuid
        payable_invoice_uuid:
          type: string
          format: uuid
        payable_invoice_item_uuid:
          type: string
          format: uuid
          nullable: true
        amount:
          type: number
        currency:
          type: string
        metadata:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
    Payment:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        payment_number:
          type: string
        tenant_id:
          type: string
        beneficiary_type:
          type: string
          enum: [PROVIDER, INSURED]
        beneficiary_uuid:
          type: string
        beneficiary_name:
          type: string
          nullable: true
        payment_method:
          type: string
          enum: [MANUAL, MOBILE_MONEY, BANK_TRANSFER, CHECK]
        payment_provider:
          type: string
          enum: [MANUAL, ORANGE_MONEY, MTN_MOMO, WAVE, FAKE, null]
          nullable: true
        status:
          type: string
          enum: [CREATED, PROCESSING, SUCCEEDED, FAILED, CANCELLED]
          description: >-
            `CREATED` : en attente de confirmation. `PROCESSING` : traitement en cours côté
            fournisseur mobile money (asynchrone). `SUCCEEDED`/`FAILED`/`CANCELLED` : états
            terminaux. Seul `CREATED` peut être confirmé via `.../confirm`.
        amount:
          type: number
        allocated_amount:
          type: number
          description: Doit être égal à `amount` (validé à la création).
        currency:
          type: string
        external_reference:
          type: string
          nullable: true
        requested_by:
          type: string
          nullable: true
        requested_at:
          type: string
          format: date-time
          nullable: true
        processing_at:
          type: string
          format: date-time
          nullable: true
        succeeded_at:
          type: string
          format: date-time
          nullable: true
        failed_at:
          type: string
          format: date-time
          nullable: true
        failure_reason:
          type: string
          nullable: true
        proof_document_uid:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        allocations:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/PaymentAllocation'
    BillingSyncEvent:
      type: object
      properties:
        cursor:
          type: integer
          description: À repasser dans le paramètre `cursor` de l'appel suivant pour reprendre après cet événement.
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
          description: 'Ex. `payable_invoice.issued`, `payment.succeeded`.'
        aggregate_type:
          type: string
          description: 'Type de ressource concernée, ex. `payable_invoice`, `payment`.'
        aggregate_uuid:
          type: string
          format: uuid
        payload:
          type: object
