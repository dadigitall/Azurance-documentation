              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total_claims:
                        type: integer
                      total_claimed:
                        type: number
                      total_approved:
                        type: number
                      total_paid:
                        type: number
                      by_status:
                        type: array
                        items:
                          type: object
                          properties:
                            status:
                              type: string
