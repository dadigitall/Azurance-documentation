          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        date_of_birth:
          type: string
          format: date
        gender:
          type: string
          enum: [MALE, FEMALE]
        phone_primary:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 150
        address:
          type: string
        city:
          type: string
          maxLength: 100
