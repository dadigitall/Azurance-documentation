          maxLength: 500
        changed_by:
          type: string
          maxLength: 120
    RenewSubscriptionRequest:
      type: object
      required: [subscription_number, effective_date, expiry_date]
      description: >-
        Crée un nouveau contrat lié à celui-ci via `renewed_from_uuid`, réplique les
        bénéficiaires actifs et remet les compteurs d'usage annuels à zéro.
      properties:
        subscription_number:
          type: string
          maxLength: 60
          description: Numéro du nouveau contrat (doit être unique, distinct de l'actuel).
        effective_date:
          type: string
          format: date
        expiry_date:
          type: string
          format: date
          description: Doit être postérieure à `effective_date`.
        premium_amount:
          type: number
          minimum: 0
        annual_coverage_limit:
          type: number
          minimum: 0
        metadata:
          type: object
    Beneficiary:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        tenant_id:
          type: string
        subscription_uuid:
          type: string
          format: uuid
          nullable: true
        beneficiary_number:
          type: string
          nullable: true
        identity_uid:
          type: string
          nullable: true
        national_id:
          type: string
          nullable: true
        first_name:
          type: string
        last_name:
          type: string
        date_of_birth:
          type: string
          format: date
        gender:
          type: string
          enum: [MALE, FEMALE]
        relationship:
          type: string
          enum: [SELF, SPOUSE, CHILD, PARENT, SIBLING, OTHER]
        is_dependent:
          type: boolean
          nullable: true
        coverage_start_date:
          type: string
          format: date
        coverage_end_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, TERMINATED]
        metadata:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AddBeneficiaryRequest:
      type: object
      required: [first_name, last_name, date_of_birth, gender, relationship, coverage_start_date]
      properties:
        beneficiary_number:
          type: string
          maxLength: 60
        identity_uid:
          type: string
          maxLength: 50
        national_id:
          type: string
          maxLength: 50
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        date_of_birth:
          type: string
          format: date
        gender:
          type: string
          enum: [MALE, FEMALE]
        relationship:
          type: string
          enum: [SELF, SPOUSE, CHILD, PARENT, SIBLING, OTHER]
        is_dependent:
          type: boolean
        coverage_start_date:
          type: string
          format: date
        coverage_end_date:
          type: string
          format: date
          description: Doit être postérieure à `coverage_start_date` si fournie.
        metadata:
          type: object
    UpdateBeneficiaryStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, TERMINATED]
paths:
  /api/v1/prior-authorizations:
    get:
      operationId: listPriorAuthorizations
      summary: Lister les préautorisations à traiter
      x-codeSamples:
        - lang: curl
          source: |
            curl --request GET \
              --url "https://insurer-api-sandbox.elenami.com/api/v1/prior-authorizations?status=PENDING_REVIEW" \
              --header "X-Api-Key: $AZURANCE_INSURER_API_KEY"
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING_REVIEW, INFO_NEEDED, APPROVED, REJECTED, EXPIRED, CANCELLED, CONSUMED]
        - in: query
          name: provider_uuid
          schema: { type: string, format: uuid }
        - in: query
          name: subscription_uid
          schema: { type: string }
        - in: query
          name: covered_person_uid
          schema: { type: string }
        - in: query
          name: per_page
          description: Taille de page, 20 par défaut.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Liste paginée des préautorisations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PriorAuthorization'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.prior_authorizations.view` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /api/v1/prior-authorizations/{uid}:
    get:
      operationId: getPriorAuthorization
      summary: Consulter une préautorisation
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Détail de la préautorisation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PriorAuthorization'
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.prior_authorizations.view` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Aucune préautorisation avec cet UUID pour ce tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/prior-authorizations/{uid}/decision:
    post:
      operationId: decidePriorAuthorization
      summary: Décider une préautorisation
      description: Approuve, refuse ou demande des informations complémentaires. Une approbation crée une réservation souple du plafond.
      x-codeSamples:
        - lang: curl
          source: |
            curl --request POST \
              --url "https://insurer-api-sandbox.elenami.com/api/v1/prior-authorizations/00000000-0000-4000-8000-000000000001/decision" \
              --header "Content-Type: application/json" \
              --header "X-Api-Key: $AZURANCE_INSURER_API_KEY" \
              --data '{"decision":"APPROVED","decided_by":"medical_advisor","authorized_amount":150000,"expires_at":"2026-07-30T23:59:59Z","conditions":["Facturation conforme au proforma validé"]}'
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, decided_by]
              properties:
                decision:
                  type: string
                  enum: [APPROVED, REJECTED, INFO_NEEDED]
                  description: APPROVED = accord; REJECTED = refus; INFO_NEEDED = pièces ou clarification requises.
                decided_by:
                  type: string
                  maxLength: 120
                authorized_amount:
                  type: number
                  minimum: 0.01
                  description: Obligatoire si `decision` vaut `APPROVED` (422 sinon).
                expires_at:
                  type: string
                  format: date-time
                  description: Doit être dans le futur si fournie.
                reason:
                  type: string
                  maxLength: 2000
                  description: Obligatoire si `decision` vaut `REJECTED` ou `INFO_NEEDED` (422 sinon).
                notes:
                  type: string
                  maxLength: 4000
                conditions:
                  type: array
                  items:
                    type: string
                metadata:
                  type: object
      responses:
        '200':
          description: Décision enregistrée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PriorAuthorization'
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.prior_authorizations.view` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Aucune préautorisation avec cet UUID pour ce tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            `authorized_amount` manquant pour une approbation, `reason` manquant pour un
            refus/demande d'info, ou préautorisation déjà décidée/expirée (transition
            invalide). ⚠️ Dans ce dernier cas, `error_code` reprend le même texte que
            `message` (pas un vrai code machine-readable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Cette préautorisation a déjà été traitée.
        '503':
          description: Service externe indisponible (limite/réservation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
  /api/v1/auth/verify:
    get:
      operationId: verifyApiKey
      summary: Vérifier la clé API et les scopes visibles
      description: >-
        Point d'entrée recommandé pour valider une intégration : ne nécessite aucun scope
        particulier (seule une clé API valide de type `INSURER` suffit), contrairement à
        tous les autres endpoints qui exigent chacun un scope précis.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Clé API valide
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    enum: [true]
                  environment:
                    type: string
                    enum: [sandbox, production]
                  tenant_uid:
                    type: string
                    format: uuid
                  tenant_slug:
                    type: string
                  tenant_name:
                    type: string
                  subject_type:
                    type: string
                    enum: [INSURER]
                  subject_uid:
                    type: string
                    format: uuid
                  subject_name:
                    type: string
                  scopes:
                    type: array
                    description: Liste des scopes réellement accordés à cette clé (détermine quels endpoints répondront 200 plutôt que 403).
                    items:
                      type: string
              example:
                valid: true
                environment: sandbox
                tenant_uid: b2c9a800-0000-4000-8000-000000000010
                tenant_slug: nsia-assurances
                tenant_name: NSIA Assurances
                subject_type: INSURER
                subject_uid: 5d000000-0000-4000-8000-000000000010
                subject_name: NSIA Assurances
                scopes:
                  - insurer.claims.view
                  - insurer.claims.manage
                  - insurer.members.view
                  - insurer.members.manage
                  - eligibility.check
        '401':
          description: En-tête `X-Api-Key` manquant, ou clé invalide/révoquée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
              example:
                statusCode: 401
                message: X-Api-Key header is required
                error: Unauthorized
        '403':
          description: Clé valide mais pas de type `INSURER` (ex. clé prestataire utilisée par erreur sur cette API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
              example:
                statusCode: 403
                message: API key is not authorized for insurer APIs
                error: Forbidden
  /api/v1/members:
    get:
      operationId: listMembers
      summary: Lister les assurés du portefeuille
      description: >-
        ⚠️ Un filtre `status` existe côté API mais n'est pas transmis :
        seul `search` (nom ou numéro de police) est réellement utilisable ici.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: search
          description: Recherche libre sur le nom ou le numéro de police.
          schema:
            type: string
      responses:
        '200':
          description: Liste paginée des assurés
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.members.view` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
    post:
      operationId: createMember
      summary: Créer un assuré
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberRequest'
            example:
              policy_number: POL-2026-004821
              first_name: Awa
              last_name: Diarra
              date_of_birth: '1991-03-12'
              gender: FEMALE
              phone_primary: '+2250700000000'
              email: awa.diarra@example.com
              status: ACTIVE
              kyc_status: VERIFIED
      responses:
        '201':
          description: Assuré créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.members.manage` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '422':
          description: '`policy_number` déjà utilisée pour ce tenant, ou champ requis manquant/invalide'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: 'Le numéro de police "POL-2026-004821" existe déjà pour ce tenant.'
                errors:
                  policy_number:
                    - 'Le numéro de police "POL-2026-004821" existe déjà pour ce tenant.'
  /api/v1/members/{memberId}:
    get:
      operationId: getMember
      summary: Consulter un assuré
      description: Contrairement à la liste, inclut les souscriptions de l'assuré (`subscriptions`).
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - in: path
          name: memberId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Assuré, avec ses souscriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.members.view` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Aucun assuré avec cet UUID pour ce tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateMember
      summary: Mettre à jour un assuré
      description: >-
        Mise à jour partielle limitée aux coordonnées et au statut — l'identité
