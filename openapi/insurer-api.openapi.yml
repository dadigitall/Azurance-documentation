  /api/v1/claims/{claimId}/fraud-assessment:
    post:
      operationId: triggerFraudAssessment
      summary: Déclencher une évaluation de fraude pour un claim
      description: >-
        Met en file d'attente une évaluation de fraude asynchrone (traitement par job en
        arrière-plan). Idempotent par `idempotency_key` : rejouer la même clé pour le même
        claim renvoie l'évaluation déjà créée (même `assessment_uuid`, statut inchangé),
        sans en recréer une ni relancer le job — jamais de 409 sur cet endpoint.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerFraudAssessmentRequest'
            example:
              trigger: CLAIM_SUBMITTED
              priority: NORMAL
              idempotency_key: fraud-assess-7c3f9e10-2b4a-4f61-9d3e-1a2b3c4d5e6f
      responses:
        '202':
          description: >-
            Évaluation en file d'attente (ou déjà existante si `idempotency_key` a été
            réutilisée pour ce claim)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assessment_uuid:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [QUEUED]
                      accepted_at:
                        type: string
                        format: date-time
              example:
                data:
                  assessment_uuid: 4d5e6f70-0000-4000-8000-000000000200
                  status: QUEUED
                  accepted_at: '2026-08-04T10:20:00Z'
        '400':
          description: >-
            `tenant_id`, `tenant_uid`, `insurer_uid` ou `insurer_uuid` fourni dans le corps,
            ou `trigger`/`idempotency_key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.claims.manage` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
    get:
      operationId: getLatestFraudAssessment
      summary: Récupérer la dernière évaluation de fraude pour un claim
      description: >-
        Renvoie la plus récente évaluation non remplacée (`status != SUPERSEDED`) pour ce
        claim, quel que soit son statut d'avancement (`QUEUED`, `RUNNING`, `COMPLETED`...).
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Dernière évaluation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FraudAssessment'
              example:
                data:
                  uuid: 4d5e6f70-0000-4000-8000-000000000200
                  tenant_id: b2c9a800-0000-4000-8000-000000000010
                  claim_uuid: 7c3f9e10-2b4a-4f61-9d3e-1a2b3c4d5e6f
                  provider_uuid: 3d2e1a00-0000-4000-8000-000000000077
                  status: COMPLETED
                  risk_score: 42
                  risk_level: MEDIUM
                  recommended_action: REVIEW_IF_ALREADY_IN_VALIDATION
                  trigger: CLAIM_SUBMITTED
                  priority: NORMAL
                  request_id: 7f1e2d3c-0000-4000-8000-000000000301
                  completed_at: '2026-08-04T10:20:04Z'
                  created_at: '2026-08-04T10:20:00Z'
                  updated_at: '2026-08-04T10:20:04Z'
                  flags:
                    - code: REPEATED_CLAIM
                      category: PATTERN
                      severity: MEDIUM
                      confidence: 0.7
                      explanation: 4 claims similaires soumis par ce prestataire ces 30 derniers jours.
                      evidence:
                        repeat_count: 4
                      source: RepeatedClaimRule
                      source_version: '1.0'
                  ai_runs: []
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.claims.view` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Aucune évaluation (active) trouvée pour ce claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
