                      count: 74
                      total_amount: 8100000
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.analytics.view` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /api/v1/analytics/loss-ratio:
    get:
      operationId: getLossRatio
      summary: Ratio de sinistralité (primes vs sinistres)
      description: >-
        `loss_ratio` = sinistres payés/approuvés (`APPROVED` + `PAID`) rapportés aux primes
        des souscriptions actuellement actives, en pourcentage. `date_from`/`date_to`
        filtrent les claims sur `service_date` ; les primes, elles, reflètent toujours
        l'état actuel du portefeuille (pas de filtre temporel sur les primes).
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - in: query
          name: date_from
          schema: { type: string, format: date }
        - in: query
          name: date_to
          schema: { type: string, format: date }
      responses:
        '200':
          description: Ratio de sinistralité
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total_premiums:
                        type: number
                      total_incurred:
                        type: number
                        description: Somme des `amount_approved` des claims `APPROVED`/`PAID` sur la période.
                      loss_ratio:
                        type: number
                        description: '`total_incurred / total_premiums * 100`, arrondi à 2 décimales (0 si `total_premiums` est nul).'
                      by_plan:
                        type: array
                        description: >-
                          ⚠️ `plan_code` ici est en réalité `coverage_type_code` (raccourci
                          interne), pas le vrai code de plan — à ne pas confondre
                          avec `plan_code` des autres endpoints analytics.
                        items:
                          type: object
                          properties:
                            plan_code:
                              type: string
                              description: En pratique un `coverage_type_code`, voir la note ci-dessus.
                            claims_count:
                              type: integer
                            incurred:
                              type: number
                            premiums:
                              type: number
                            loss_ratio:
                              type: number
              example:
                data:
                  total_premiums: 7800000
                  total_incurred: 5400000
                  loss_ratio: 69.23
                  by_plan:
                    - plan_code: OUTPATIENT_PHARMACY
                      claims_count: 74
                      incurred: 3100000
                      premiums: 5250000
                      loss_ratio: 59.05
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.analytics.view` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /api/v1/analytics/provider-performance:
    get:
      operationId: getProviderPerformance
      summary: Performance par prestataire (volume, taux d'approbation)
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - in: query
          name: date_from
          schema: { type: string, format: date }
        - in: query
          name: date_to
          schema: { type: string, format: date }
        - in: query
          name: limit
          description: Nombre de prestataires renvoyés, triés par volume de claims décroissant. Pas de maximum imposé côté serveur ; 20 par défaut.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Performance prestataires
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      providers:
                        type: array
                        items:
                          type: object
                          properties:
                            provider_uuid:
                              type: string
                              format: uuid
                            provider_name:
                              type: string
                              nullable: true
                            total_claims:
                              type: integer
                            total_claimed:
                              type: number
                            total_approved:
                              type: number
                            approved_count:
                              type: integer
                            rejected_count:
                              type: integer
                            approval_rate:
                              type: number
                              description: '`approved_count / total_claims * 100`.'
                            rejection_rate:
                              type: number
              example:
                data:
                  providers:
                    - provider_uuid: 3d2e1a00-0000-4000-8000-000000000077
                      provider_name: Pharmacie du Plateau
                      total_claims: 74
                      total_claimed: 8100000
                      total_approved: 6900000
                      approved_count: 58
                      rejected_count: 9
                      approval_rate: 78.38
                      rejection_rate: 12.16
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.analytics.view` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /api/v1/analytics/coverage-utilization:
    get:
      operationId: getCoverageUtilization
      summary: Utilisation des couvertures (plafonds annuels)
      description: >-
        Une ligne par souscription active ayant un `annual_coverage_limit` défini, triée par
        montant utilisé décroissant — pas un agrégat par type de couverture malgré le nom de
        l'endpoint.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - in: query
          name: limit
          description: Nombre de souscriptions renvoyées. Pas de maximum imposé côté serveur ; 50 par défaut.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Utilisation des couvertures
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total_coverage_limit:
                        type: number
                        description: Somme des `annual_coverage_limit` (souscriptions actives avec plafond défini uniquement).
                      total_used_amount:
                        type: number
                        description: >-
                          Somme des `annual_used_amount` de **toutes** les souscriptions
                          actives, y compris celles sans plafond — peut donc dépasser
                          `total_coverage_limit` en proportion.
                      overall_utilization:
                        type: number
                      subscriptions:
                        type: array
                        items:
                          type: object
                          properties:
                            uuid:
                              type: string
                              format: uuid
                            subscription_number:
                              type: string
                            plan_code:
                              type: string
                            plan_name:
                              type: string
                              nullable: true
                            annual_coverage_limit:
                              type: number
                            annual_used_amount:
                              type: number
                            lifetime_used_amount:
                              type: number
                            status:
                              type: string
                            utilization_percentage:
                              type: number
                            remaining_coverage:
                              type: number
              example:
                data:
                  total_coverage_limit: 620000000
                  total_used_amount: 198400000
                  overall_utilization: 32.0
                  subscriptions:
                    - uuid: 1a2b3c4d-0000-4000-8000-000000000055
                      subscription_number: SUB-2026-001122
                      plan_code: PLAN_ESSENTIAL
                      plan_name: Plan Essentiel
                      annual_coverage_limit: 2000000
                      annual_used_amount: 320000
                      lifetime_used_amount: 320000
                      status: ACTIVE
                      utilization_percentage: 16.0
                      remaining_coverage: 1680000
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.analytics.view` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: Lister les notifications
      description: >-
        ⚠️ Pagination Adonis/Lucid, différente du reste de l'API : le paramètre de taille de
        page est `limit` (pas `per_page`, sans effet ici), et la réponse imbrique un second
        niveau `data`/`meta` (`data.data` = tableau des notifications, `data.meta` =
        pagination), pas `data`/`meta` au premier niveau comme ailleurs.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          description: Taille de page, 25 par défaut, 100 maximum (au-delà, plafonné silencieusement à 100).
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: recipient_id
          schema: { type: string }
        - in: query
          name: event_type
          schema: { type: string }
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, SENT, FAILED, SKIPPED]
      responses:
        '200':
          description: Liste paginée des notifications (double imbrication `data.data`/`data.meta`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      meta:
                        type: object
                        properties:
                          total:
                            type: integer
                          perPage:
                            type: integer
                          currentPage:
                            type: integer
                          lastPage:
                            type: integer
                          firstPage:
                            type: integer
                          firstPageUrl:
                            type: string
                            nullable: true
                          lastPageUrl:
                            type: string
                            nullable: true
                          nextPageUrl:
                            type: string
                            nullable: true
                          previousPageUrl:
                            type: string
                            nullable: true
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'
              example:
                data:
                  meta:
                    total: 12
                    perPage: 25
                    currentPage: 1
                    lastPage: 1
                    firstPage: 1
                    firstPageUrl: /?page=1
                    lastPageUrl: /?page=1
                    nextPageUrl: null
                    previousPageUrl: null
                  data:
                    - uid: 01J9ZK4Q6X8T7Y3V2W1N0M5R4S
                      recipient_id: 5d000000-0000-4000-8000-000000000010
                      recipient_email: ops@nsia-assurances.example
                      recipient_phone: null
                      event_type: claim.status_changed
                      channel: EMAIL
                      status: SENT
                      subject: Votre claim CLM-2026-004821 a été approuvé
                      body: null
                      variables:
                        claim_number: CLM-2026-004821
                        status: APPROVED
                      metadata: {}
                      provider: mailtrap
                      provider_message_id: 5f2a-abc123
                      error_message: null
                      critical: false
                      sent_at: '2026-08-04T10:20:10Z'
                      read_at: null
                      created_at: '2026-08-04T10:20:05Z'
                      updated_at: '2026-08-04T10:20:10Z'
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.notifications.view` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /api/v1/notifications/{id}:
    get:
      operationId: getNotification
      summary: Consulter une notification
      description: '`id` accepte soit l''`uid` (ULID) soit l''`id` numérique interne.'
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Notification
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Notification'
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.notifications.view` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Aucune notification avec cet identifiant pour ce tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Notification not found
  /api/v1/notifications/{id}/read:
