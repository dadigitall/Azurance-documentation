                      by_plan:
                        type: array
                        items:
                          type: object
                          properties:
                            plan_code:
                              type: string
                            count:
                              type: integer
                            total_premium:
                              type: number
              example:
                data:
                  total_subscriptions: 340
                  active_subscriptions: 312
                  total_policyholders: 298
                  total_premiums: 7800000
                  by_plan:
