  /api/v1/providers/network-relationships:
    get:
      operationId: listProviderNetworkRelationships
      summary: Lister les prestataires conventionnés de la compagnie
      description: >
        Retourne les prestataires liés au réseau de la compagnie authentifiée par X-Api-Key,
        avec le statut de convention, le niveau réseau et les informations utiles de suivi.
        Cet endpoint ne remplace pas eligibility/check pour une prestation ou un assuré précis.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [all, active, ended]
          description: Filtre optionnel. all retourne toutes les relations; active retourne les relations actives; ended retourne les relations clôturées.
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [HOSPITAL, CLINIC, PHARMACY, LABORATORY, SPECIALIST]
          description: Filtre optionnel par type de prestataire.
      responses:
        '200':
          description: Prestataires conventionnés de la compagnie
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InsurerProviderNetworkRelationship'
                  meta:
                    type: object
                    description: >-
                      `insurer_uid`, `insurer_name`, `insurer_organization_uid`,
                      `relationship_count`. Si aucune organisation assureur correspondante
                      n'est trouvée, `data` est vide et `meta`
                      contient un champ `note` explicatif au lieu de `insurer_organization_uid`.
              example:
                data:
                  - relationship_uid: 96000000-0000-4000-8000-000000000001
                    relationship_type: care_network
                    relationship_status: ACTIVE
                    network_status: PREFERRED
                    network_name: Réseau Plateau
                    network_tier: preferred
                    contract_reference: CTR-2026-0091
                    contract_start_date: '2026-01-01T00:00:00Z'
                    contract_end_date: null
                    claim_submission_enabled: true
                    requires_prior_authorization: false
                    covered_service_families: [PHARMACY, OUTPATIENT]
                    insurer:
                      uid: 5d000000-0000-4000-8000-000000000010
                      name: NSIA Assurances
                      trade_name: NSIA
                      status: ACTIVE
                      country_code: CI
                    provider:
                      organization_uid: 3d2e1a00-0000-4000-8000-000000000077
                      provider_uid: 3d2e1a00-0000-4000-8000-000000000077
                      name: Pharmacie du Plateau
                      trade_name: null
                      type: PHARMACY
                      status: ACTIVE
                      country_code: CI
                meta:
                  insurer_uid: 5d000000-0000-4000-8000-000000000010
                  insurer_name: NSIA Assurances
                  insurer_organization_uid: 5d000000-0000-4000-8000-000000000010
                  relationship_count: 1
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.providers.view` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /api/v1/providers/network-requests:
