  /api/v1/eligibility/check:
    post:
      operationId: checkEligibility
      summary: Vérifier l'éligibilité d'une personne couverte
      description: >-
        Vérifie en temps réel qu'une personne assurée (souscripteur ou bénéficiaire) est
        couverte pour un type de soin donné, chez un prestataire donné. Si `amount` est
        fourni, calcule aussi un remboursement estimé et vérifie les plafonds annuels.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EligibilityCheckRequest'
            example:
              identifier: POL-2026-004821
              coverage_code: OUTPATIENT_PHARMACY
              amount: 45000
              provider_uuid: 3d2e1a00-0000-4000-8000-000000000077
              service_date: '2026-08-04'
              purpose: PRECHECK
      responses:
        '200':
          description: "Personne éligible pour cette couverture (`eligible: true`)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EligibilityCheckResult'
              example:
                data:
                  eligibility_check_uuid: 9a1b2c3d-4e5f-4061-8f2a-1b2c3d4e5f60
                  eligible: true
                  status: ELIGIBLE
                  error_code: null
                  reason: null
                  purpose: PRECHECK
                  read_only: true
                  valid_until: '2026-08-04T10:20:00Z'
                  provider_network:
                    in_network: true
                  member:
                    uuid: 5f6e7d8c-0000-4000-8000-000000000099
                    policy_number: POL-2026-004821
                    identity_uid: null
                    full_name: Awa Diarra
                    age: 34
                    status: ACTIVE
                    kyc_status: VERIFIED
                  subscription:
                    uuid: 1a2b3c4d-0000-4000-8000-000000000055
                    subscription_number: SUB-2026-001122
                    plan_code: PLAN_ESSENTIAL
                    plan_name: Plan Essentiel
                    status: ACTIVE
                    effective_date: '2026-01-01'
                    expiry_date: '2026-12-31'
                    annual_coverage_limit: 2000000
                    annual_used_amount: 320000
                    remaining_coverage: 1680000
                  coverage:
                    uuid: 6b7c8d9e-0000-4000-8000-000000000010
                    code: OUTPATIENT_PHARMACY
                    name: Pharmacie ambulatoire
                    base_rate: 0.8
                    annual_limit: 500000
                    remaining_limit: 455000
                    requires_authorization: false
                    network_restriction: null
                    limit_usage:
                      used: 45000
                      remaining: 455000
                  reimbursement:
                    eligible: true
                    reimbursement_amount: 36000
                    decision: APPROVED
                    decision_reason: null
                  contract_context: {}
        '400':
          description: >-
            `tenant_id`, `tenant_uid`, `insurer_uid` ou `insurer_uuid` fourni dans le corps
            (interdit — ces valeurs sont dérivées de `X-Api-Key`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
              example:
                statusCode: 400
                message: tenant_id is derived from X-Api-Key and cannot be provided externally
                error: Bad Request
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `eligibility.check` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '422':
          description: >-
            Deux cas partagent ce code : (1) requête valide mais personne non éligible
            (`eligible: false`, mêmes champs qu'un 200) ; (2) corps de requête invalide
            (champ requis manquant, ou `provider_id`/`provider_uuid` tous deux absents).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [data]
                    additionalProperties: false
                    properties:
                      data:
                        $ref: '#/components/schemas/EligibilityCheckResult'
                  - $ref: '#/components/schemas/ValidationError'
              examples:
                ineligible:
                  summary: Personne non éligible
                  value:
                    data:
                      eligibility_check_uuid: 9a1b2c3d-4e5f-4061-8f2a-1b2c3d4e5f61
                      eligible: false
                      status: INELIGIBLE
                      error_code: NO_ACTIVE_SUBSCRIPTION
                      reason: Aucun contrat actif pour la date de prestation
                      purpose: PRECHECK
                      read_only: true
                      valid_until: '2026-08-04T10:20:00Z'
                      provider_network: null
                      member:
                        uuid: 5f6e7d8c-0000-4000-8000-000000000099
                        policy_number: POL-2026-004821
                        identity_uid: null
                        full_name: Awa Diarra
                        age: 34
                        status: ACTIVE
                        kyc_status: VERIFIED
                      subscription: null
                      coverage: null
                      reimbursement: null
                      contract_context: null
                validation_failed:
                  summary: Corps de requête invalide
                  value:
                    message: The coverage code field is required.
                    errors:
                      coverage_code:
                        - The coverage code field is required.
        '503':
          description: Service en amont injoignable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
              example:
                message: Service externe indisponible
                service: upstream
  /api/v1/eligibility/check-batch:
    post:
      operationId: checkEligibilityBatch
      summary: Vérifier l'éligibilité en lot
      description: >-
        Jusqu'à 20 vérifications en une seule requête. Contrairement à l'endpoint unitaire,
        répond toujours en 200 même si un ou plusieurs éléments sont inéligibles : il faut
        inspecter le champ `eligible` de chaque résultat individuellement.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EligibilityBatchCheckRequest'
            example:
              checks:
                - identifier: POL-2026-004821
                  coverage_code: OUTPATIENT_PHARMACY
                  provider_uuid: 3d2e1a00-0000-4000-8000-000000000077
                - identifier: POL-2026-009910
                  coverage_code: HOSPITALIZATION
                  provider_id: 412
                  service_date: '2026-08-04'
      responses:
        '200':
          description: >-
            Résultats dans le même ordre que `checks` en entrée (toujours 200, y compris si
            un ou plusieurs éléments ont `eligible: false`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EligibilityCheckResult'
              example:
                data:
                  - eligibility_check_uuid: 9a1b2c3d-4e5f-4061-8f2a-1b2c3d4e5f60
                    eligible: true
                    status: ELIGIBLE
                    error_code: null
                    reason: null
                    purpose: PRECHECK
                    read_only: true
                    valid_until: '2026-08-04T10:20:00Z'
                    member:
