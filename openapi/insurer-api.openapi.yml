      summary: Lister les demandes d'adhésion réseau reçues
      description: >
        Retourne les demandes `care_network` adressées à l'organisation assureur authentifiée.
        Utilisez cet endpoint pour traiter les demandes initiées par des prestataires via
        `POST /api/v1/network/request` côté API prestataire.
