    post:
      operationId: createPayment
      summary: Créer un paiement
      description: >-
        Crée un paiement à l'état `CREATED` et l'alloue immédiatement sur une ou plusieurs
        factures/lignes payables. Ne le confirme pas : pour les canaux manuels
        (`MANUAL`/`BANK_TRANSFER`/`CHECK`), appeler ensuite `.../confirm`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            example:
              idempotency_key: pay-91000000-000000000001-20260804
              payment_method: MANUAL
              beneficiary_type: PROVIDER
              beneficiary_uuid: 3d2e1a00-0000-4000-8000-000000000077
              beneficiary_name: Pharmacie du Plateau
              amount: 245000
              currency: XOF
              allocations:
                - payable_invoice_uuid: 91000000-0000-4000-8000-000000000001
                  amount: 245000
      responses:
        '201':
          description: Paiement créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Payment'
              example:
                data:
                  uuid: 93000000-0000-4000-8000-000000000001
                  payment_number: PAY-2026-000318
                  tenant_id: b2c9a800-0000-4000-8000-000000000010
                  beneficiary_type: PROVIDER
                  beneficiary_uuid: 3d2e1a00-0000-4000-8000-000000000077
                  beneficiary_name: Pharmacie du Plateau
                  payment_method: MANUAL
                  payment_provider: null
                  status: CREATED
                  amount: 245000
                  allocated_amount: 245000
                  currency: XOF
                  external_reference: null
                  requested_by: insurer-ops-billing-team
                  requested_at: '2026-08-04T10:30:00Z'
                  processing_at: null
                  succeeded_at: null
                  failed_at: null
                  failure_reason: null
                  proof_document_uid: null
                  created_at: '2026-08-04T10:30:00Z'
                  updated_at: '2026-08-04T10:30:00Z'
                  allocations:
                    - uuid: 94000000-0000-4000-8000-000000000001
                      tenant_id: b2c9a800-0000-4000-8000-000000000010
                      payment_uuid: 93000000-0000-4000-8000-000000000001
                      payable_invoice_uuid: 91000000-0000-4000-8000-000000000001
                      payable_invoice_item_uuid: null
                      amount: 245000
                      currency: XOF
                      created_at: '2026-08-04T10:30:00Z'
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.billing.manage` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '422':
          description: >-
            Erreur métier (ex. `amount` ≠ somme des allocations, allocation supérieure au
            reste dû d'une ligne/facture, facture annulée) ou erreur de validation classique
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Le montant du paiement doit être égal à la somme des allocations.
