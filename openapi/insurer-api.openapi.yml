  /api/v1/claims/{claimId}/status:
    put:
      operationId: updateClaimStatusPut
      summary: Mettre à jour le statut d'un claim
      description: >-
        Fait transitionner le claim vers un nouveau statut. Strictement équivalent au PATCH
        sur le même endpoint — les deux verbes déclenchent exactement le même traitement.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClaimStatusRequest'
            example:
              status: REJECTED
              reason: Documents justificatifs illisibles, à resoumettre.
              reviewed_by: insurer-ops-claims-team
      responses:
        '200':
          description: Claim mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Claim'
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.claims.manage` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Aucun claim avec cet UUID pour ce tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Transition de statut invalide (`status` absent de la liste autorisée côté
            service claims, ex. `PENDING`, ou transition non permise depuis le statut actuel)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: The selected status is invalid.
    patch:
      operationId: updateClaimStatusPatch
      summary: Mettre à jour le statut d'un claim
      description: Alias strict de `PUT /api/v1/claims/{claimId}/status` — même comportement, même validation.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClaimStatusRequest'
            example:
              status: APPROVED
              reason: Conforme à la couverture, montant validé.
              reviewed_by: insurer-ops-claims-team
      responses:
        '200':
          description: Claim mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Claim'
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.claims.manage` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Aucun claim avec cet UUID pour ce tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Transition de statut invalide
