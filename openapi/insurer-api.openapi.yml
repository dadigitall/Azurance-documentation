        effective_date:
          type: string
          format: date
        expiry_date:
          type: string
          format: date
        premium_amount:
          type: number
          nullable: true
        premium_frequency:
          type: string
          enum: [MONTHLY, QUARTERLY, ANNUAL, null]
          nullable: true
        annual_coverage_limit:
          type: number
          nullable: true
        annual_used_amount:
          type: number
        remaining_coverage:
          type: number
          nullable: true
        lifetime_used_amount:
          type: number
        last_premium_payment_date:
          type: string
          format: date
          nullable: true
        renewed_from_uuid:
          type: string
          format: uuid
          nullable: true
