        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Notification marquée comme lue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Notification'
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.notifications.view` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Aucune notification avec cet identifiant pour ce tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/notifications/preferences:
    get:
      operationId: getNotificationPreferences
      summary: Lister les préférences de notification
      description: >-
        ⚠️ Le paramètre `recipient_id` documenté précédemment est sans effet : l'API
        ne transmet aucun paramètre de requête à cet endpoint. Renvoie systématiquement
        toutes les préférences du tenant, tous destinataires confondus.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Préférences de notification (non paginé)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationPreference'
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.notifications.view` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
    put:
      operationId: updateNotificationPreferences
      summary: Mettre à jour les préférences de notification
      description: >-
        ⚠️ Chemin corrigé : il n'existe pas de `{recipientId}` dans l'URL. Le destinataire
        est **toujours** l'assureur authentifié lui-même (dérivé de `X-Api-Key`, comme le
        tenant) — impossible de gérer les préférences d'un tiers via cette API. Upsert sur
        `event_type` : appeler une fois par type d'événement à configurer, ou omettre
        `event_type` pour la préférence par défaut.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
            example:
              event_type: claim.status_changed
              channels_enabled: [EMAIL, IN_APP]
              is_enabled: true
      responses:
        '200':
          description: Préférence créée ou mise à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationPreference'
        '401':
          description: En-tête `X-Api-Key` manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope `insurer.notifications.manage` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '422':
          description: '`channels_enabled` contient une valeur hors énumération, ou `event_type` trop court/long'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
